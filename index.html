<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fn_leak</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0c0c0e; color: #c9d1d9;
    font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    height: 100%;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 100%;
  }
  #bar {
    flex: 0 0 auto;
    padding: 8px 12px;
    background: #141418;
    border-bottom: 1px solid #26262e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  #title {
    font-weight: 600;
    color: #7cb7ff;
    letter-spacing: 0.02em;
  }
  #state {
    color: #7a7a86;
    font-size: 12px;
    text-align: right;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #state.ok   { color: #7ee787; }
  #state.warn { color: #d9a23a; }
  #state.bad  { color: #ff7b72; }

  #out {
    flex: 1 1 auto;
    margin: 0;
    padding: 10px 14px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    -webkit-overflow-scrolling: touch;
    background: #0c0c0e;
    color: #d8d8de;
    font-size: 12px;
  }
  #out .ok   { color: #7ee787; }
  #out .warn { color: #d9a23a; }
  #out .bad  { color: #ff7b72; }

  /* Fullscreen hint for the PS4 browser */
  #hint {
    position: fixed;
    bottom: 6px; right: 10px;
    color: #55555e;
    font-size: 11px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <span id="title">fn_leak</span>
    <span id="state">booting…</span>
  </div>
  <pre id="out"></pre>
</div>
<div id="hint">L1+R1+Options for fullscreen</div>

<script type="module">
  // Fail loud if the module graph doesn't load. ES module import errors
  // are silent on the PS4 browser, and a blank screen is useless.
  window.addEventListener("error", (e) => {
    const s = document.getElementById("state");
    if (s) {
      s.textContent = "load-error: " + (e.message || "unknown");
      s.className = "bad";
    }
  });
  window.addEventListener("unhandledrejection", (e) => {
    const s = document.getElementById("state");
    if (s) {
      s.textContent = "promise-rejected: " +
        ((e.reason && e.reason.message) || String(e.reason));
      s.className = "bad";
    }
  });

  // The module specifier must match the file in the folder exactly.
  // If the file is named fn_leak.js, this is fn_leak.js. If you renamed
  // it, change it here too. The cache-buster query is not needed on the
  // PS4 browser because it doesn't cache module specifiers, but a fresh
  // value per load doesn't hurt.
  import("./fn_leak.js").catch((err) => {
    const s = document.getElementById("state");
    const o = document.getElementById("out");
    if (s) {
      s.textContent = "import-failed";
      s.className = "bad";
    }
    if (o) {
      o.textContent = "Failed to load ./fn_leak.js\n\n" +
        (err && err.message ? err.message : String(err)) +
        "\n\nCheck that the file exists, that it imports ./core.js, " +
        "./int64.js and ./ps4_offsets.js, and that those files are in " +
        "the same directory.";
    }
  });
</script>

</body>
</html>
